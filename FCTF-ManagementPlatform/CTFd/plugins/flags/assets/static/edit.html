<label>
	Static<br>
	<small>Enter static flag data</small>
</label>
<div class="alert" style="background:#fff8e6;border:1px solid #f0d789;color:#7a5c00;border-radius:6px;padding:.5rem .75rem;font-size:.85rem;">
	If this challenge deploys a pod, don't hardcode this flag in the challenge source or Docker image —
	the pod receives it as the <code>FLAG</code> environment variable at deploy time.
</div>
<div class="form-group">
	<input type="text" class="form-control" name="content" value="{{ content }}">
</div>
<div class="form-group">
	<select class="form-control custom-select col-md-6" name="data">
		<option value="">Case Sensitive</option>
		<option value="case_insensitive" {% if data %}selected{% endif %}>Case Insensitive</option>
	</select>
</div>
<input type="hidden" name="type" value="static">
<input type="hidden" name="id" value="{{ id }}">
<hr>
<div class="form-group">
	<button class="btn btn-success float-right">Update</button>
</div>
