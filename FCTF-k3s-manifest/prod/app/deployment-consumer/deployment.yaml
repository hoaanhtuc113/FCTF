apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: app
  name: deployment-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployment-consumer
  template:
    metadata:
      labels:
        app: deployment-consumer
    spec:
      serviceAccountName: deployment-consumer-sa
      priorityClassName: app-normal-preemption
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: deployment-consumer
          image: <REGISTRY_DOMAIN>/fctf/deployment-consumer:latest
          ports:
            - name: http-health
              containerPort: 5040
              protocol: TCP
          envFrom:
            - configMapRef:
                name: deployment-consumer-cm
            - secretRef:
                name: deployment-consumer-secret
            - secretRef:
                name: common-private-key-secret
          env:
            # CA that signed the Redis server certificate. Without it the
            # service falls back to the container trust store, which does not
            # know fctf-internal-ca, and the connection fails - certificate
            # validation is on by default now.
            - name: REDIS_TLS_CA_FILE
              value: /etc/redis-ca/ca.crt
          resources:
            requests:
              cpu: 0.3
              memory: 256Mi
            limits:
              cpu: 1
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5040
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5040
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            seLinuxOptions:
              type: container_t
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: redis-ca
              mountPath: /etc/redis-ca
              readOnly: true
      imagePullSecrets:
        - name: regcred
      volumes:
        # Only ca.crt - the leaf and key in this secret are for a later mTLS
        # switch and nothing here uses them yet.
        - name: redis-ca
          secret:
            secretName: redis-client-tls
            items:
              - key: ca.crt
                path: ca.crt
  revisionHistoryLimit: 3
