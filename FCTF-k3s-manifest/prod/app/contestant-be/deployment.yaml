apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: app
  name: contestant-be
spec:
  replicas: 3
  selector:
    matchLabels:
      app: contestant-be
  template:
    metadata:
      labels:
        app: contestant-be
    spec:
      priorityClassName: app-normal-preemption
      # No K8s API calls made from this pod - don't hand it a token it has no use for.
      automountServiceAccountToken: false
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      securityContext:
        fsGroup: 1102
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: contestant-be
          image: <REGISTRY_DOMAIN>/fctf/contestant-be:latest
          ports:
            - name: http-client
              containerPort: 5010
              protocol: TCP
          envFrom:
            - configMapRef:
                name: contestant-be-cm
            - secretRef:
                name: contestant-be-secret
            - secretRef:
                name: common-private-key-secret
          env:
            # CA that signed the Redis server certificate. Without it the
            # service falls back to the container trust store, which does not
            # know fctf-internal-ca, and the connection fails - certificate
            # validation is on by default now.
            - name: REDIS_TLS_CA_FILE
              value: /etc/redis-ca/ca.crt
          resources:
            requests:
              cpu: 0.3
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5010
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5010
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          imagePullPolicy: Always
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1102
            runAsGroup: 1102
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - NET_RAW
            seLinuxOptions:
              type: container_t
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: nfs-shared-data
              mountPath: /mnt/nfs/data/file
              readOnly: true
            - name: redis-ca
              mountPath: /etc/redis-ca
              readOnly: true
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: nfs-shared-data
          persistentVolumeClaim:
            claimName: contestant-be-file-pvc
        # Only ca.crt - the leaf and key in this secret are for a later mTLS
        # switch and nothing here uses them yet.
        - name: redis-ca
          secret:
            secretName: redis-client-tls
            items:
              - key: ca.crt
                path: ca.crt
  revisionHistoryLimit: 3
