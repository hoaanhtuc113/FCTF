apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: app
  name: challenge-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: challenge-gateway
  template:
    metadata:
      labels:
        app: challenge-gateway
    spec:
      priorityClassName: app-normal-preemption
      # No K8s API calls made from this pod - don't hand it a token it has no use for.
      automountServiceAccountToken: false
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: challenge-gateway
          image: <REGISTRY_DOMAIN>/fctf/challenge-gateway:latest
          envFrom:
            - configMapRef:
                name: challenge-gateway-cm
            - secretRef:
                name: challenge-gateway-secret
            - secretRef:
                name: common-private-key-secret
          env:
            - name: GATEWAY_TLS_CERT_FILE
              value: /etc/gateway/tls/tls.crt
            - name: GATEWAY_TLS_KEY_FILE
              value: /etc/gateway/tls/tls.key
            # CA that signed the Redis server certificate. Setting this turns
            # on chain and hostname verification for the Redis connection and
            # overrides REDIS_TLS_INSECURE_SKIP_VERIFY, so the gateway stops
            # accepting whatever certificate answers on that address. The file
            # is kept current by cert-manager via redis-client-cert.yaml.
            - name: REDIS_TLS_CA_FILE
              value: /etc/redis-ca/ca.crt
          resources:
            requests:
              cpu: 0.1
              memory: 128Mi
            limits:
              cpu: 0.3
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          imagePullPolicy: Always
          volumeMounts:
            - name: gateway-tls
              mountPath: /etc/gateway/tls
              readOnly: true
            - name: redis-ca
              mountPath: /etc/redis-ca
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            seLinuxOptions:
              type: container_t
            seccompProfile:
              type: RuntimeDefault
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: gateway-tls
          secret:
            secretName: gateway-tls
        # Only ca.crt - the leaf and its private key in this secret are for a
        # future mTLS switch and the gateway has no use for them today.
        - name: redis-ca
          secret:
            secretName: redis-client-tls
            items:
              - key: ca.crt
                path: ca.crt
  revisionHistoryLimit: 3
---
apiVersion: v1
kind: Service
metadata:
  name: challenge-gateway-svc
  namespace: app
spec:
  ports:
    - protocol: TCP
      name: tcp-1337
      port: 1337
      targetPort: 1337
      nodePort: 30037
    - protocol: TCP
      name: http-8080
      port: 8080
      targetPort: 8080
      nodePort: 30038
  selector:
    app: challenge-gateway
  type: NodePort
