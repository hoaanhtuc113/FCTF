apiVersion: v1
kind: Namespace
metadata:
  name: app
  labels:
    pod-security.kubernetes.io/enforce: "restricted"
    pod-security.kubernetes.io/enforce-version: "latest"
    pod-security.kubernetes.io/audit: "restricted"
    pod-security.kubernetes.io/audit-version: "latest"
    pod-security.kubernetes.io/warn: "restricted"
    pod-security.kubernetes.io/warn-version: "latest"
---
# Every workload in this namespace already either uses its own dedicated
# SA (deployment-center-sa/deployment-consumer-sa/deployment-listener-sa)
# or explicitly sets automountServiceAccountToken: false at the pod level
# (admin-mvc/challenge-gateway/contestant-be/contestant-portal) - nothing
# relies on default's token. Neutralize it at the SA level too, so a
# future pod that forgets the pod-level override doesn't silently get one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: app
automountServiceAccountToken: false
