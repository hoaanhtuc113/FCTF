apiVersion: v1
kind: ServiceAccount
metadata:
  name: start-chal-v2-workflow-sa
  namespace: argo
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: up-challenge-workflow-sa
  namespace: argo
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflow-executor-role
  namespace: argo
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: start-chal-v2-workflow-executor-binding
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: start-chal-v2-workflow-sa
    namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-workflow-executor-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: up-challenge-workflow-executor-binding
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: up-challenge-workflow-sa
    namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-workflow-executor-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: start-chal-v2-workflow-sa-role
rules:
  # Matches exactly what deploy-challenge-v2 applies from
  # challenge-hardened.yaml/challenge-plain.yaml (Namespace, ResourceQuota,
  # Service, NetworkPolicy, Job) plus the imagePullSecret copy step (Secret).
  # This SA used to be bound to cluster-admin.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get"]
  # `kubectl apply` reads the live object before writing it, so every kind
  # here needs get alongside create - a missing get fails the apply even when
  # the object does not exist yet. Leaving resourcequotas out did not stop the
  # deploy: apply reported the quota as forbidden, carried on to create the
  # Job, and the challenge ran in a namespace with no resource ceiling at all.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get"]
  # Secret access is scoped to global-regcred by name: the only secret this
  # SA ever reads (kubectl get secret global-regcred -n argo) or writes (the
  # copy of that same secret into the newly created challenge namespace).
  # resourceNames restricts `get` correctly, but Kubernetes RBAC cannot
  # restrict `create` by resource name (the object name isn't known at
  # authorization time) - the accompanying ValidatingAdmissionPolicy below
  # covers that gap for create.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["global-regcred"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get"]
  # Rancher's admission webhook adds a check the API server's own RBAC does
  # not: creating a namespace that carries pod-security.kubernetes.io labels
  # requires the `updatepsa` permission on management.cattle.io/projects,
  # which it asks for with a SubjectAccessReview. Every challenge namespace
  # sets those labels, so without this rule the webhook rejects the deploy
  # with a bare "Unauthorized" that names neither PSA nor this permission.
  # The verb exists only for that check - it grants no read or write access
  # to Rancher projects.
  - apiGroups: ["management.cattle.io"]
    resources: ["projects"]
    verbs: ["updatepsa"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: start-chal-v2-workflow-binding
subjects:
  - kind: ServiceAccount
    name: start-chal-v2-workflow-sa
    namespace: argo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: start-chal-v2-workflow-sa-role