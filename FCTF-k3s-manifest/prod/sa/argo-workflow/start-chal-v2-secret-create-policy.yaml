# Kubernetes RBAC cannot restrict `create` requests by resource name (the
# API server doesn't know the object's name until it parses the request
# body, which happens after authorization). start-chal-v2-workflow-sa-role
# grants `create` on secrets cluster-wide because of that limitation - this
# policy closes the gap at admission time: the only secret this SA may ever
# create is a copy of global-regcred (see start-chal-v2-template.yaml, the
# "Copying imagePullSecret" step), so any other secret name is denied.
#
# Requires Kubernetes >=1.30 (ValidatingAdmissionPolicy GA) or >=1.28 with the
# ValidatingAdmissionPolicy feature gate enabled. Verify the cluster's k3s
# version supports admissionregistration.k8s.io/v1 before applying.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: start-chal-v2-sa-secret-create-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  validations:
    - expression: >-
        request.userInfo.username != 'system:serviceaccount:argo:start-chal-v2-workflow-sa' ||
        object.metadata.name == 'global-regcred'
      message: "start-chal-v2-workflow-sa may only create a secret named global-regcred"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: start-chal-v2-sa-secret-create-scope-binding
spec:
  policyName: start-chal-v2-sa-secret-create-scope
  validationActions: ["Deny"]
