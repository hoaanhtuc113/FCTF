# Server certificate for Redis, replacing the chart's tls.autoGenerated one.
#
# The generated certificate was self-signed by the chart and regenerated on
# helm upgrade, so no client could ever validate it - the only way to connect
# was to skip verification. This one is signed by fctf-internal-ca, whose
# ca.crt clients can pin.
#
# Every name a client might use has to appear here, because a name missing from
# the SAN list fails verification even when the chain is trusted:
#   redis-headless.db.svc.cluster.local  what REDIS_ADDR / REDIS_HOST /
#                                        REDIS_CONNECTION all point at, so this
#                                        is the name the gateway checks
#   redis-master*                        the chart's ClusterIP service, used if
#                                        a client is repointed at it
#   redis-master-0.redis-headless...     the pod's own stable DNS name
#   localhost + 127.0.0.1                the chart's liveness/readiness probes
#                                        run `redis-cli -h localhost --cacert
#                                        ...` inside the pod, and that check
#                                        verifies the hostname too - leaving
#                                        these out makes the pod never ready
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: redis-tls
  namespace: db
spec:
  secretName: redis-tls
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
    - key encipherment
  commonName: redis-headless.db.svc.cluster.local
  dnsNames:
    - redis-headless.db.svc.cluster.local
    - redis-headless.db.svc
    - redis-headless
    - redis-master.db.svc.cluster.local
    - redis-master.db.svc
    - redis-master
    - redis-master-0.redis-headless.db.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: fctf-internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
