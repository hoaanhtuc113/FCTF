---
apiVersion: v1
kind: Secret
metadata:
  namespace: ctfd
  name: ctfd-app-secret
stringData:
  DATABASE_URL: "mysql+pymysql://ctfd-username:__FCTF_SECRET_LEGACY_CTFD_DB_PASSWORD__@mariadb-ctfd-headless.ctfd.svc.cluster.local:3306/ctfd"
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: ctfd
  name: ctfd-cm
data:
  UPLOAD_FOLDER: "/var/uploads"
  REDIS_URL: "redis://redis-ctfd-headless.ctfd.svc.cluster.local:6379"
  WORKERS: "1"
  LOG_FOLDER: "/var/log/CTFd"
  ACCESS_LOG: "-"
  ERROR_LOG: "-"
  REVERSE_PROXY: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: regcred
  namespace: ctfd
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "https://index.docker.io/v1/": {
          "username": "quachuoiscontainer",
          "password": "__FCTF_SECRET_LEGACY_DOCKERHUB_PASSWORD__",
          "email": "williamkieu-devops@outlook.com"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ctfd
  name: ctfd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ctfd
  template:
    metadata:
      labels:
        app: ctfd
    spec:
      priorityClassName: stateful-core
      preemptionPolicy: Never
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: ctfd
          image: quachuoiscontainer/fctf:ctfd-original
          ports:
            - name: http-client
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ctfd-cm
            - secretRef:
                name: ctfd-app-secret
          resources:
            requests:
              cpu: 0.2
              memory: 512Mi
            limits:
              cpu: 0.2
              memory: 512Mi
          imagePullPolicy: Always
      imagePullSecrets:
        - name: regcred
  revisionHistoryLimit: 3
---
apiVersion: v1
kind: Service
metadata:
  namespace: ctfd
  name: ctfd
spec:
  ports:
    - name: http-client
      port: 8000
      targetPort: 8000
  selector:
    app: ctfd
---
## Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: ctfd
  name: ctfd-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-dev
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  rules:
    - host: ctfd-backup.fctf.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ctfd
                port:
                  number: 8000
  tls:
    - hosts:
        - ctfd-backup.fctf.cloud
      secretName: ctfd-tls
---
# Cert
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ctfd-tls
  namespace: ctfd
spec:
  secretName: ctfd-tls
  dnsNames:
    - ctfd-backup.fctf.cloud
  issuerRef:
    name: letsencrypt-dev
    kind: ClusterIssuer
