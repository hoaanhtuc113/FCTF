apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: up-challenge-template
  namespace: argo
  annotations:
    workflows.argoproj.io/description: "Build and push challenge image from NFS using Kaniko"
spec:
  serviceAccountName: up-challenge-workflow-sa
  entrypoint: main
  ttlStrategy:
    secondsAfterSuccess: 604800     # 7 days
    secondsAfterFailure: 1209600    # 14 days
  onExit: send-message

  arguments:
    parameters:
      - name: CHALLENGE_PATH
      - name: CHALLENGE_ID
      - name: IMAGE_REPO
        value: fctf
      - name: IMAGE_TAG
      - name: DEPLOYMENT_CENTER_API_ENDPOINT
        value: http://deployment-center-svc.app.svc.cluster.local:5020/api/statuscheck/message

  templates:
    - name: main
      steps:
        - - name: build-and-push
            template: build-and-push
            arguments:
              parameters:
                - name: CHALLENGE_PATH
                  value: "{{workflow.parameters.CHALLENGE_PATH}}"
                - name: IMAGE_REPO
                  value: "{{workflow.parameters.IMAGE_REPO}}"
                - name: IMAGE_TAG
                  value: "{{workflow.parameters.IMAGE_TAG}}"

    # ======================================================
    # BUILD & PUSH IMAGE (KANIKO)
    # ======================================================
    - name: build-and-push
      inputs:
        parameters:
          - name: CHALLENGE_PATH
          - name: IMAGE_REPO
          - name: IMAGE_TAG
      priorityClassName: lowest
      metadata:
        labels:
          app: kaniko-builder
      podSpecPatch: |
        preemptionPolicy: Never
        securityContext:
          fsGroup: 1103
          fsGroupChangePolicy: OnRootMismatch

      container:
        image: gcr.io/kaniko-project/executor:debug
        imagePullPolicy: IfNotPresent

        # Kaniko needs root to write build layers, but does NOT require
        # privileged mode - that's the whole point of Kaniko vs Docker-in-Docker.
        # It does need the filesystem-ownership capabilities: it chowns the
        # Dockerfile it copies into /kaniko, and restores owner, mode, device
        # nodes and file capabilities while extracting base image layers.
        # Without them even uid 0 fails with EPERM. Everything dangerous
        # (SYS_ADMIN, NET_RAW, NET_ADMIN, SYS_PTRACE, ...) stays dropped.
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add:
              - CHOWN
              - DAC_OVERRIDE
              - FOWNER
              - FSETID
              - SETGID
              - SETUID
              - MKNOD
              - SETFCAP
          seccompProfile:
            type: RuntimeDefault

        # Production-safe resources (tested range)
        #
        # ephemeral-storage is the one that was missing. Kaniko unpacks the base
        # image and writes every snapshot layer into its own container filesystem,
        # which comes out of the node's disk - and cpu and memory limits do nothing
        # about that. Without a limit the kubelet has no reason to evict this pod
        # before the disk fills, and a full node takes down whatever else is
        # scheduled on it, not just the build. With one, an oversized build dies on
        # its own and the node survives.
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
            ephemeral-storage: "1Gi"
          limits:
            cpu: "500m"
            memory: "1Gi"
            ephemeral-storage: "4Gi"

        env:
          - name: DOCKER_CONFIG
            value: /kaniko/.docker

        volumeMounts:
          - name: nfs-shared-data
            mountPath: /mnt/nfs/data
            readOnly: true
          - name: docker-config
            mountPath: /kaniko/.docker
            readOnly: true

        command: ["/busybox/sh", "-c"]
        args:
          - |
            set -euo pipefail

            echo "=== Building and pushing image with Kaniko ==="

            CHALLENGE_PATH_RAW="{{inputs.parameters.CHALLENGE_PATH}}"
            CHALLENGE_PATH_NORM="${CHALLENGE_PATH_RAW#./}"
            CHALLENGE_PATH_NORM="${CHALLENGE_PATH_NORM#challenges/}"
            CHALLENGE_PATH_NORM="${CHALLENGE_PATH_NORM#/}"

            CANDIDATE_1="/mnt/nfs/data/${CHALLENGE_PATH_RAW}"
            CANDIDATE_2="/mnt/nfs/data/${CHALLENGE_PATH_NORM}"

            if [ "${CHALLENGE_PATH_RAW#/}" != "$CHALLENGE_PATH_RAW" ]; then
              CANDIDATE_3="$CHALLENGE_PATH_RAW"
            else
              CANDIDATE_3=""
            fi

            echo "🔎 CANDIDATE_1: $CANDIDATE_1"
            echo "🔎 CANDIDATE_2: $CANDIDATE_2"
            if [ -n "$CANDIDATE_3" ]; then
              echo "🔎 CANDIDATE_3: $CANDIDATE_3"
            fi

            CHALLENGE_DIR=""
            CHALLENGE_DIR_SOURCE=""
            if [ -d "$CANDIDATE_1" ]; then
              CHALLENGE_DIR="$CANDIDATE_1"
              CHALLENGE_DIR_SOURCE="CANDIDATE_1"
            elif [ -d "$CANDIDATE_2" ]; then
              CHALLENGE_DIR="$CANDIDATE_2"
              CHALLENGE_DIR_SOURCE="CANDIDATE_2"
            elif [ -n "$CANDIDATE_3" ] && [ -d "$CANDIDATE_3" ]; then
              CHALLENGE_DIR="$CANDIDATE_3"
              CHALLENGE_DIR_SOURCE="CANDIDATE_3"
            fi

            if [ -z "$CHALLENGE_DIR" ]; then
              echo "❌ Challenge directory not found"
              echo "   - Tried: $CANDIDATE_1"
              echo "   - Tried: $CANDIDATE_2"
              if [ -n "$CANDIDATE_3" ]; then
                echo "   - Tried: $CANDIDATE_3"
              fi
              echo "📂 /mnt/nfs/data (top-level):"
              ls -la /mnt/nfs/data || true
              echo "📂 /mnt/nfs/data (maxdepth=3):"
              find /mnt/nfs/data -maxdepth 3 -type d | sort || true
              exit 1
            fi

            echo "✅ Selected ${CHALLENGE_DIR_SOURCE}: $CHALLENGE_DIR"

            if [ ! -f "$CHALLENGE_DIR/Dockerfile" ]; then
              echo "❌ Dockerfile not found in $CHALLENGE_DIR"
              exit 1
            fi

            echo "📁 Build context: $CHALLENGE_DIR"
            cd "$CHALLENGE_DIR"

            # Measure the context before Kaniko reads it. The uploader caps what a
            # single archive expands to, but this folder is on a share several
            # things can write to, and it is the node's disk that pays for whatever
            # is there by the time the build runs. Refusing here names the reason;
            # hitting the ephemeral-storage limit instead only says the pod died.
            MAX_CONTEXT_KB=524288
            CONTEXT_KB="$(du -sk . | cut -f1)"
            echo "📦 Build context size: ${CONTEXT_KB} KiB"

            if [ "$CONTEXT_KB" -gt "$MAX_CONTEXT_KB" ]; then
              echo "❌ Build context is ${CONTEXT_KB} KiB, over the limit of ${MAX_CONTEXT_KB} KiB"
              echo "   Trim the challenge folder, or raise MAX_CONTEXT_KB together with"
              echo "   the ephemeral-storage limit on this step - they bound the same thing."
              exit 1
            fi

            /kaniko/executor \
              --dockerfile=Dockerfile \
              --context=dir://. \
              --custom-platform=linux/amd64 \
              --snapshot-mode=redo \
              --verbosity=info \
              --destination=<REGISTRY_DOMAIN>/{{inputs.parameters.IMAGE_REPO}}/{{inputs.parameters.IMAGE_TAG}}:latest

            echo "✅ Image pushed: <REGISTRY_DOMAIN>/{{inputs.parameters.IMAGE_REPO}}/{{inputs.parameters.IMAGE_TAG}}:latest"

      volumes:
        - name: nfs-shared-data
          persistentVolumeClaim:
            claimName: up-challenge-file-pvc

        - name: docker-config
          secret:
            secretName: global-regcred
            items:
              - key: .dockerconfigjson
                path: config.json

    # ======================================================
    # ON EXIT: SEND STATUS
    # ======================================================
    - name: send-message
      priorityClassName: lowest
      podSpecPatch: |
        preemptionPolicy: Never
        imagePullSecrets:
          - name: global-regcred

      container:
        image: <REGISTRY_DOMAIN>/fctf/kubectl-cli:latest
        imagePullPolicy: IfNotPresent

        # HARDENED (safe – no write needed)
        securityContext:
          runAsUser: 1103
          runAsGroup: 1103
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          privileged: false
          capabilities:
            drop: ["ALL"]

        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"

        envFrom:
          - secretRef:
              name: common-private-key-secret

        command: ["/bin/sh", "-c"]
        args:
          - |
            set +e

            WORKFLOW_NAME="{{workflow.name}}"
            WORKFLOW_STATUS="{{workflow.status}}"
            WORKFLOW_TYPE="up"
            CHALLENGE_ID="{{workflow.parameters.CHALLENGE_ID}}"
            ENDPOINT="{{workflow.parameters.DEPLOYMENT_CENTER_API_ENDPOINT}}"
            UNIX_TIME="$(date +%s)"

            # /api/statuscheck/message requires [RequireSecretKey]: HMAC-SHA256
            # keyed with PRIVATE_KEY over unixTime followed by one line per
            # field, sorted by field name and written as name=bytelength:value.
            # The length is what keeps the field boundaries inside the signature
            # - concatenating the values alone let anyone in the path move a
            # digit from one field to the next and keep the signature valid.
            # Must match SecretKeyHelper.CreateSecretKey (C#) and CTFd's
            # create_secret_key (Python) exactly.
            sign_field() {
              printf '%s=%s:%s\n' "$1" "$(printf '%s' "$2" | wc -c | tr -d ' ')" "$2"
            }

            # Command substitution eats the trailing newline of the last field,
            # so it is put back below - the signed message ends with one.
            SIGN_INPUT="$(
              printf '%s\n' "${UNIX_TIME}"
              sign_field ChallengeId "${CHALLENGE_ID}"
              sign_field Status "${WORKFLOW_STATUS}"
              sign_field Type "${WORKFLOW_TYPE}"
              sign_field WorkFlowName "${WORKFLOW_NAME}"
            )"

            if command -v openssl >/dev/null 2>&1; then
              SECRET_KEY="$(printf '%s\n' "${SIGN_INPUT}" \
                | openssl dgst -sha256 -hmac "${PRIVATE_KEY}" -r | awk '{print $1}')"
            else
              echo "ERROR: openssl not available in this image - cannot sign status callback, skipping"
              SECRET_KEY=""
            fi

            echo "Posting workflow status to deployment center"

            if [ -n "${SECRET_KEY}" ]; then
              curl -sS -X POST "${ENDPOINT}" \
                -H 'Content-Type: application/json' \
                -H "SecretKey: ${SECRET_KEY}" \
                -d '{
                  "WorkFlowName": "'"${WORKFLOW_NAME}"'",
                  "ChallengeId": '"${CHALLENGE_ID}"',
                  "Status": "'"${WORKFLOW_STATUS}"'",
                  "Type": "'"${WORKFLOW_TYPE}"'",
                  "unixTime": "'"${UNIX_TIME}"'"
                }' || true
            fi
