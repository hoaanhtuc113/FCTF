apiVersion: v1
kind: ConfigMap
metadata:
  name: deployment-listener-cm
  namespace: app
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
  ASPNETCORE_URLS: "http://+:5030"

  # `legacy` uses the existing CHALLENGE_ACCESS_TOKEN_KEY. For key rotation,
  # change this after the Gateway keyring contains the new `kid` and keep the
  # old key until every prior assertion has expired.
  CHALLENGE_ACCESS_TOKEN_ACTIVE_KID: "legacy"
  # Keep assertions metadata-only unless a trusted rollout explicitly opts in.
  CHALLENGE_ACCESS_TOKEN_CAPTURE_PROFILE: ""

  CHALLENGE_WATCHER_WORKER_COUNT: "20"
