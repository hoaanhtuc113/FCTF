apiVersion: v1
kind: ConfigMap
metadata:
  name: deployment-center-cm
  namespace: app
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: "false"
  ASPNETCORE_URLS: "http://+:5020"
  ARGO_WORKFLOWS_URL: "http://argo-workflows-server.argo.svc.cluster.local:2746/api/v1/workflows/argo"
  START_CHALLENGE_TEMPLATE: "start-chal-v2-template"
  UP_CHALLENGE_TEMPLATE: "up-challenge-template"
  RABBIT_HOST: "rabbitmq.db.svc.cluster.local"
  RABBIT_USERNAME: "deployment-producer"
  RABBIT_VHOST: "fctf_deploy"
  RABBIT_PORT: "5671"
  RABBIT_TLS: "true"

  DEPLOYMENT_QUEUE_TIMEOUT_MINUTES: "5"

  # Share of deployment_queue (x-max-length 300) any single contest may hold.
  # Keeps a busy contest from filling the shared queue and pushing every other
  # contest into 429. 0 disables the quota.
  MAX_QUEUED_PER_CONTEST: "100"

  # Pacing for a single team. Nothing else bounds how fast a team may loop
  # start/stop, and every start is a real Argo workflow and a real namespace.
  # Both limits are checked on start, not on stop: throttling the stop would only
  # keep the namespace alive longer.
  #
  # DEPLOY_COOLDOWN_SECONDS is the wait a team owes on one challenge after
  # stopping it. MAX_STARTS_PER_TEAM bounds the loop across every challenge, so
  # rotating between them does not sidestep the cooldown. 0 disables either one.
  DEPLOY_COOLDOWN_SECONDS: "60"
  MAX_STARTS_PER_TEAM: "20"
  START_WINDOW_MINUTES: "10"

  POW_DIFFICULTY_SECONDS: "5" 

  LOKI_BASE_URL: "http://loki-stack.monitoring.svc.cluster.local:3100"

  LOKI_QUERY_SELECTOR: "{app=\"challenge-gateway\"}"

  # S3 reader is intentionally distinct from the Gateway writer. Keep the
  # endpoint/bucket blank until the read-only credential and a least-privilege
  # NetworkPolicy egress rule have been provisioned.
  REQUEST_LOG_S3_ENDPOINT: ""
  REQUEST_LOG_S3_BUCKET: ""
  REQUEST_LOG_S3_REGION: "us-east-1"
  REQUEST_LOG_S3_PATH_STYLE: "true"
  # Local shared-volume reader is development-only. Detail/list metadata still
  # work when content is unavailable.
  REQUEST_LOG_OBJECT_DIR: ""
  REQUEST_LOG_READ_MAX_BYTES: "8388608"
  REQUEST_LOG_COMPRESSED_READ_MAX_BYTES: "4194304"
  REQUEST_LOG_BODY_CAP_BYTES: "262144"
  REQUEST_LOG_UPLOAD_GRACE_SECONDS: "60"
  REQUEST_LOG_CONTENT_TTL_SECONDS: "86400"
  CHALLENGE_ACCESS_TOKEN_CAPTURE_PROFILE: ""
