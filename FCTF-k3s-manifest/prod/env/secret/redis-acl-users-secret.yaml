apiVersion: v1
kind: Secret
metadata:
  name: redis-acl-users-secret
  namespace: db
type: Opaque
stringData:
  # Single key "users.acl" required by Bitnami Redis chart v21+ (Redis 8.x).
  # Older chart versions used one key per username; newer versions mount this
  # entire file directly at /opt/bitnami/redis/mounted-etc/users.acl.
  users.acl: |
    user svc_admin_mvc on >__FCTF_SECRET_ADMIN_MVC_REDIS_PASS__ ~* &* +ping +echo +select +get +set +setex +del +unlink +exists +expire +ttl +pttl +persist +incr +decr +scan +keys +hget +hset +hmget +mget +hmset +hdel +publish +subscribe +psubscribe +unsubscribe +punsubscribe +eval +evalsha
    user svc_gateway on >__FCTF_SECRET_CHALLENGE_GATEWAY_REDIS_PASSWORD__ ~fctf:gateway:* &* +ping +echo +select +get +set +time +exists +expire +del +incr +decr +hget +hset +hmget +hmset +eval +evalsha %R~deploy_challenge_* +eval_ro
    user svc_contestant_be on >__FCTF_SECRET_CONTESTANT_BE_REDIS_PASSWORD__ ~submission_cooldown_* ~attempt_count_* ~deploy_challenge_* ~active_deploys_team_* ~auth:user:* ~challenge:* ~hint:* ~kpm_check_* ~fctf:contestant:* &* +ping +echo +select +get +set +setex +del +exists +expire +ttl +pttl +incr +decr +scan +hmget +mget +keys +zadd +zrem +zremrangebyscore +zscore +zcard +eval +evalsha +incrbyfloat ~fctf:gateway:revoked:* +script|load
    user svc_deployment_center on >__FCTF_SECRET_DEPLOYMENT_CENTER_REDIS_PASSWORD__ ~deploy_challenge_* ~active_deploys_team_* &* +ping +echo +select +get +set +setex +del +exists +expire +ttl +incr +decr +scan +keys +zadd +zrem +zremrangebyscore +zscore +zcard +eval +evalsha ~fctf:gateway:revoked:* +script|load
    user svc_deployment_consumer on >__FCTF_SECRET_DEPLOYMENT_CONSUMER_REDIS_PASSWORD__ ~deploy_challenge_* ~active_deploys_team_* &* +ping +echo +select +get +set +setex +del +exists +expire +ttl +incr +decr +scan +keys +zadd +zrem +zremrangebyscore +zscore +zcard +eval +evalsha ~fctf:gateway:revoked:* +script|load
    user svc_deployment_listener on >__FCTF_SECRET_DEPLOYMENT_LISTENER_REDIS_PASSWORD__ ~deploy_challenge_* ~active_deploys_team_* &* +ping +echo +select +get +set +setex +del +exists +expire +ttl +incr +decr +scan +keys +zadd +zrem +zremrangebyscore +zscore +zcard +eval +evalsha ~fctf:gateway:revoked:* +script|load
