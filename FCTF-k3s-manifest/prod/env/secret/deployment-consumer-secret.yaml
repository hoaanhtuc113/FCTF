apiVersion: v1
kind: Secret
metadata:
  name: deployment-consumer-secret
  namespace: app
stringData:
  DB_CONNECTION: "Server=mariadb-headless.db.svc.cluster.local;Port=3306;Database=ctfd;User=deployment_consumer;Password=__FCTF_SECRET_DEPLOYMENT_CONSUMER_DB_PASSWORD__;"
  REDIS_CONNECTION: "redis-headless.db.svc.cluster.local:6379,user=svc_deployment_consumer,password=__FCTF_SECRET_DEPLOYMENT_CONSUMER_REDIS_PASSWORD__,defaultDatabase=0,ssl=true,sslProtocols=Tls12"
  RABBIT_PASSWORD: "__FCTF_SECRET_DEPLOYMENT_CONSUMER_RABBIT_PASSWORD__"
