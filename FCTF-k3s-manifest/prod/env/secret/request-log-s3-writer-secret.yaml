apiVersion: v1
kind: Secret
metadata:
  name: request-log-s3-writer-secret
  namespace: app
type: Opaque
# Populate from the secret manager before changing REQUEST_LOG_CAPTURE_PROFILE
# to bounded_content. This identity needs PutObject only for the dedicated
# request-log bucket/prefix; it must not receive Get/List/Delete permissions.
stringData:
  REQUEST_LOG_S3_ACCESS_KEY: ""
  REQUEST_LOG_S3_SECRET_KEY: ""
  REQUEST_LOG_S3_SESSION_TOKEN: ""
