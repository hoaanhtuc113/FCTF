apiVersion: v1
kind: Secret
metadata:
  name: redis-acl-file
  namespace: db
type: Opaque
stringData:
  # Keep this block free of '#' comments: Redis parses every non-blank line of
  # an aclfile as a user declaration and refuses to start on anything else.
  #
  # `default` is the account a client gets when it AUTHs with a password and no
  # username, so leaving it at `~* &* +@all` made the per-service rules below
  # decorative - one leaked password was full read/write/delete on every key,
  # no need to match any service's key pattern. It can't be switched off
  # entirely, because the chart's liveness/readiness probes run `redis-cli ping`
  # as default with the password from redis-auth-secret, so it keeps that one
  # command and no key or channel access at all.
  #
  # Side effect: no account can run ACL LOAD any more. Changing this file now
  # means `kubectl apply -f` on this secret plus
  # `kubectl rollout restart statefulset/redis-master -n db`.
  #
  # svc_admin_mvc was the other account that made the scoping below pointless:
  # `~* &*` let it read and overwrite every other service's keys, so anything
  # that reached admin-mvc's credentials reached the gateway's rate-limit
  # counters and the deployment services' state as well.
  #
  # It now holds one root pattern plus three selectors - the parenthesised
  # groups - which are Redis 7's way of saying "these commands, but only on these
  # keys". Root permissions and each selector are evaluated independently and a
  # command passes if any of them allows both the command and the key, so the
  # root command list below applies to fctf:admin:* alone:
  #
  #   ~fctf:admin:*  everything CTFd owns outright: the Flask-Caching entries
  #                  (CACHE_KEY_PREFIX in CTFd/config.py, which also covers the
  #                  rl:<ip>:<endpoint> rate-limit counters since those go
  #                  through the cache) and the per-challenge workflow handle
  #                  from get_workflow_key(). Full command set.
  #   (~deploy_challenge_* +get +exists +del +unlink)
  #                  shared with contestant-be and the deployment services.
  #                  CTFd reads these and sweeps them; it never writes one, so
  #                  it cannot forge or rewrite a deployment record - which is
  #                  the half of tampering that deleting does not cover.
  #   (~submission_cooldown_* +get +set)   api/v1/challenges.py, also written by
  #                  contestant-be under the same key names.
  #   (~attempt_count_* +exists +decr +del)  api/v1/submissions.py, same sharing.
  #                  No +set or +incr: CTFd only ever counts one down.
  #
  # kypo_poller needed a fourth selector until its progress entries moved
  # under fctf:admin:kypo:*, where the root pattern already covers them.
  #
  # SCAN and KEYS declare no keys, so they stay in the root list and reach every
  # pattern regardless - see the note below on enumeration.
  #
  # The channel list is the single SSE channel RedisEventManager publishes to
  # and subscribes on.
  #
  # No pattern is granted for generate_cache_attempt_key()'s challenge_status_*
  # keys: that helper is defined twice and imported once but never called. If it
  # is ever wired up, note it returns an md5 hexdigest of the raw key, not the
  # raw key, so no prefix pattern can cover it - it would have to be changed to
  # emit a prefixed key first.
  #
  # Note this bounds reads and writes, not enumeration: KEYS and SCAN declare no
  # keys, so ACL patterns do not filter what they return. Any account holding
  # either can still list every key NAME in the database - the values stay out
  # of reach.
  #
  # svc_admin_mvc is the only account left with +keys. KEYS is O(N) and blocks
  # the server for the whole scan, so it is a denial of service on its own, not
  # just an enumeration primitive. The four .NET accounts had it and never
  # needed it: RedisHelper's GetKeysByPattern and GetCacheByPatternAsync both go
  # through StackExchange.Redis's server.Keys(pattern, pageSize), which issues
  # SCAN on any server past 2.8, and there is no raw KEYS call in that codebase.
  # admin-mvc keeps it because Flask-Caching's clear() calls KEYS internally and
  # CTFd calls clear() from five places; dropping it there means replacing that
  # backend, not editing a call site.
  #
  # +scan is granted only where a pattern sweep actually runs: contestant-be
  # (RemoveCacheByPattern on deploy_challenge_*_<team>), deployment-center and
  # deployment-listener (the same helper), and admin-mvc (scan_iter). Consumer
  # reaches Redis through exactly two calls - GetFromCacheAsync and
  # AtomicUpdateExpiration - and never sweeps, so it does not get one.
  #
  # Enumeration cannot be narrowed further at this layer. SCAN and KEYS return
  # names from the whole database no matter what patterns a user holds, and the
  # names themselves carry information: which team is running which challenge,
  # which user ids exist, which tokens the gateway is tracking. Separate logical
  # databases would not help either - ACLs have no per-database scope and any
  # account with +select can switch to another one. Real separation means
  # separate Redis instances per trust zone.
  #
  # The ZSET commands on the deployment accounts follow what each service's code
  # path actually runs against active_deploys_team_*. All four used to hold the
  # full set; these are the Lua scripts in RedisHelper they really call:
  #   contestant-be        reserve (ZREMRANGEBYSCORE ZSCORE ZCARD ZADD) + remove
  #                        (ZREM) - needs all five
  #   deployment-center    update (ZSCORE ZADD) + remove (ZREM)
  #   deployment-listener  update (ZSCORE ZADD) + remove (ZREM)
  #   deployment-consumer  update only (ZSCORE ZADD) - it never removes
  # Scripts execute with the calling account's permissions, so +eval grants
  # nothing extra here. This matters because deleting another team's entry
  # cancels their in-flight deploy: AtomicUpdateExpiration treats a missing
  # ZSCORE as "provisioning timed out" and reports the deploy failed. Consumer
  # losing +zrem takes one credential out of that reach.
  #
  # What this does NOT fix: every one of these accounts can still write into any
  # team's ZSET, because the pattern is active_deploys_team_* and a single shared
  # service credential serves all teams. Padding a victim's ZSET until ZCARD
  # reaches their limit locks them out of starting challenges, and no Redis-side
  # rule can distinguish that from legitimate use. Bounding it means checking the
  # limit against Kubernetes rather than trusting the counter in Redis.
  usersacl: |
    user default on >Fctf2025@ resetkeys resetchannels -@all +ping
    user svc_admin_mvc on >AdmMvcRedis2026A ~fctf:admin:* &ctf +ping +echo +select +get +set +setex +del +unlink +exists +expire +ttl +pttl +persist +incr +decr +scan +keys +hget +hset +hmget +mget +hmset +hdel +publish +subscribe +psubscribe +unsubscribe +punsubscribe (~deploy_challenge_* +get +exists +del +unlink) (~submission_cooldown_* +get +set) (~attempt_count_* +exists +decr +del)
    user svc_gateway on >GwRedis2026A ~fctf:gateway:* resetchannels +ping +echo +select +get +set +time +exists +expire +del +incr +decr +hget +hset +hmget +hmset +eval +evalsha
    user svc_contestant_be on >CbeRedis2026A ~submission_cooldown_* ~attempt_count_* ~deploy_challenge_* ~active_deploys_team_* ~auth:user:* ~challenge:* ~hint:* ~kpm_check_* ~fctf:contestant:* resetchannels +ping +echo +select +get +set +setex +del +exists +expire +ttl +pttl +incr +decr +scan +hmget +mget +zadd +zrem +zremrangebyscore +zscore +zcard +eval +evalsha +incrbyfloat
    user svc_deployment_center on >DpcRedis2026A ~deploy_challenge_* ~active_deploys_team_* resetchannels +ping +echo +select +get +set +setex +del +exists +expire +ttl +incr +decr +scan +zadd +zrem +zscore +eval +evalsha
    user svc_deployment_consumer on >DpsCRedis2026A ~deploy_challenge_* ~active_deploys_team_* resetchannels +ping +echo +select +get +set +setex +del +exists +expire +ttl +incr +decr +zadd +zscore +eval +evalsha
    user svc_deployment_listener on >DpsLRedis2026A ~deploy_challenge_* ~active_deploys_team_* resetchannels +ping +echo +select +get +set +setex +del +exists +expire +ttl +incr +decr +scan +zadd +zrem +zscore +eval +evalsha
