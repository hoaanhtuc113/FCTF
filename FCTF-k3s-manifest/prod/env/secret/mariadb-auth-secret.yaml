apiVersion: v1
kind: Secret
metadata:
  name: mariadb-auth-secret
  namespace: db
type: Opaque
stringData:
  # Use unique, high-entropy passwords. Recommended length >= 24.
  mariadb-root-password: "__FCTF_SECRET_MARIADB_AUTH_MARIADB_ROOT_PASSWORD__"
  mariadb-password: "__FCTF_SECRET_ADMIN_MVC_DB_PASSWORD__"
  # Required by the chart even in standalone mode.
  mariadb-replication-password: "__FCTF_SECRET_MARIADB_AUTH_MARIADB_REPLICATION_PASSWORD__"
