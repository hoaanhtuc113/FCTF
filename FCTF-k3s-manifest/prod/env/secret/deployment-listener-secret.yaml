apiVersion: v1
kind: Secret
metadata:
  name: deployment-listener-secret
  namespace: app
stringData:
  DB_CONNECTION: "Server=mariadb-headless.db.svc.cluster.local;Port=3306;Database=ctfd;User=deployment_listener;Password=__FCTF_SECRET_DEPLOYMENT_LISTENER_DB_PASSWORD__;"
  REDIS_CONNECTION: "redis-headless.db.svc.cluster.local:6379,user=svc_deployment_listener,password=__FCTF_SECRET_DEPLOYMENT_LISTENER_REDIS_PASSWORD__,defaultDatabase=0,ssl=true,sslProtocols=Tls12"
