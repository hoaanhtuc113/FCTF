apiVersion: v1
kind: Secret
metadata:
  name: request-log-s3-reader-secret
  namespace: app
type: Opaque
# Populate from the secret manager before enabling the S3 endpoint/bucket in
# deployment-center-cm. This identity needs GetObject only; it must not receive
# Put/List/Delete permissions.
stringData:
  REQUEST_LOG_S3_ACCESS_KEY: ""
  REQUEST_LOG_S3_SECRET_KEY: ""
  REQUEST_LOG_S3_SESSION_TOKEN: ""
