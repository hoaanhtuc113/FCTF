apiVersion: v1
kind: Secret
metadata:
  name: redis-auth-secret
  namespace: db
type: Opaque
stringData:
  # The `default` account's password, used by auth.existingSecret /
  # auth.existingSecretPasswordKey. It must stay identical to the >password on
  # the `user default` line in redis-acl-file-secret.yaml: the chart's
  # liveness/readiness probes authenticate as default with this value, and
  # default is the only thing it unlocks - every service authenticates as its
  # own svc_* account.
  #
  # Known and accepted: this string is also the Grafana admin password printed
  # in README.md, and the stem of the RabbitMQ credentials
  # (Fctf2025@producer / Fctf2025@consumer), so whoever reads the README holds
  # this one too. What that buys an attacker is now bounded - default is
  # `-@all +ping`, no keys and no channels - but it is still one credential
  # doing three jobs. Rotating it means changing this value and the ACL file
  # together; rotate-service-passwords.sh patches both, and editing one alone
  # locks the probes out and the pod stops going ready.
  redis-password: "Fctf2025@"
